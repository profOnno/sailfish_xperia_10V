<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdc3c7"/>
      <stop offset="100%" stop-color="#95a5a6"/>
    </linearGradient>
    
    <linearGradient id="androidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9dfbf"/>
      <stop offset="100%" stop-color="#7dcea0"/>
    </linearGradient>
    
    <linearGradient id="lineageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e79f"/>
      <stop offset="100%" stop-color="#f4d03f"/>
    </linearGradient>
    
    <linearGradient id="sailfishGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#5dade2"/>
    </linearGradient>

    <!-- Drop shadow for puzzle pieces -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="800" fill="#f8f9fa" rx="12"/>

  <!-- Titles -->
  <text x="475" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">The Flashing "Puzzle" — What Replaces What?</text>
  <text x="475" y="70" text-anchor="middle" font-size="14" fill="#7f8c8d">Each step overwrites specific partitions, but leaves the foundation intact.</text>

  <!-- ========================================== -->
  <!-- COLUMN HEADERS -->
  <!-- ========================================== -->
  <rect x="20" y="90" width="150" height="40" rx="6" fill="#34495e"/>
  <text x="95" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">LAYER</text>

  <rect x="190" y="90" width="220" height="40" rx="6" fill="#27ae60"/>
  <text x="300" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1. Stock Sony Android 14</text>

  <rect x="430" y="90" width="220" height="40" rx="6" fill="#d4ac0d"/>
  <text x="540" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2. After LineageOS 22.2</text>

  <rect x="670" y="90" width="260" height="40" rx="6" fill="#2471a3"/>
  <text x="800" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3. After Sailfish OS</text>


  <!-- ========================================== -->
  <!-- ROW 1: HARDWARE -->
  <!-- ========================================== -->
  <text x="95" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Hardware</text>
  
  <!-- Android -->
  <rect x="190" y="150" width="220" height="50" rx="6" fill="url(#hwGrad)" stroke="#7f8c8d" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="180" text-anchor="middle" font-size="14" fill="#2c3e50">Snapdragon 695 / Touch</text>

  <!-- Lineage -->
  <rect x="430" y="150" width="220" height="50" rx="6" fill="url(#hwGrad)" stroke="#7f8c8d" stroke-width="2" opacity="0.6"/>
  <text x="540" y="180" text-anchor="middle" font-size="14" fill="#2c3e50">(Unchanged)</text>

  <!-- Sailfish -->
  <rect x="670" y="150" width="260" height="50" rx="6" fill="url(#hwGrad)" stroke="#7f8c8d" stroke-width="2" opacity="0.6"/>
  <text x="800" y="180" text-anchor="middle" font-size="14" fill="#2c3e50">(Unchanged)</text>


  <!-- ========================================== -->
  <!-- ROW 2: FIRMWARE / BLOSS -->
  <!-- ========================================== -->
  <text x="95" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Firmware &amp; Blobs</text>
  <text x="95" y="280" text-anchor="middle" font-size="11" fill="#7f8c8d">(Camera, GPU, Modem)</text>

  <!-- Android -->
  <rect x="190" y="230" width="220" height="70" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Sony Vendor Partition</text>
  <text x="300" y="275" text-anchor="middle" font-size="12" fill="#145a32">v4b Binary Blobs</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#1e8449">(Drivers for hardware)</text>

  <!-- Lineage -->
  <rect x="430" y="230" width="220" height="70" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" opacity="0.6"/>
  <text x="540" y="260" text-anchor="middle" font-size="14" fill="#145a32">(Survives)</text>
  <text x="540" y="280" text-anchor="middle" font-size="11" fill="#1e8449">Lineage uses these drivers</text>

  <!-- Sailfish -->
  <rect x="670" y="230" width="260" height="70" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" opacity="0.6"/>
  <text x="800" y="260" text-anchor="middle" font-size="14" fill="#145a32">(Survives)</text>
  <text x="800" y="280" text-anchor="middle" font-size="11" fill="#1e8449">Sailfish uses these via libhybris</text>


  <!-- ========================================== -->
  <!-- ROW 3: KERNEL -->
  <!-- ========================================== -->
  <text x="95" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Linux Kernel</text>
  <text x="95" y="380" text-anchor="middle" font-size="11" fill="#7f8c8d">(The Engine)</text>

  <!-- Android -->
  <rect x="190" y="340" width="220" height="50" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Sony Kernel 5.4</text>

  <!-- Lineage -->
  <rect x="430" y="340" width="220" height="50" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" opacity="0.6"/>
  <text x="540" y="370" text-anchor="middle" font-size="14" fill="#145a32">(Survives)</text>

  <!-- Sailfish -->
  <rect x="670" y="340" width="260" height="50" rx="6" fill="url(#sailfishGrad)" stroke="#2471a3" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">hybris-boot.img</text>
  <text x="800" y="378" text-anchor="middle" font-size="11" fill="#1a5276">(Custom Sailfish Kernel)</text>


  <!-- ========================================== -->
  <!-- ROW 4: RECOVERY -->
  <!-- ========================================== -->
  <text x="95" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Recovery</text>
  <text x="95" y="465" text-anchor="middle" font-size="11" fill="#7f8c8d">(Flasher Tool)</text>

  <!-- Android -->
  <rect x="190" y="430" width="220" height="40" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="455" text-anchor="middle" font-size="14" fill="#145a32">Sony Stock Recovery</text>

  <!-- Lineage -->
  <rect x="430" y="430" width="220" height="40" rx="6" fill="url(#lineageGrad)" stroke="#b9770e" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d6608">Lineage Recovery (boot.img)</text>

  <!-- Sailfish -->
  <rect x="670" y="430" width="260" height="40" rx="6" fill="url(#sailfishGrad)" stroke="#2471a3" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">Sailfish Boot / Recovery</text>


  <!-- ========================================== -->
  <!-- ROW 5: SYSTEM PARTITION -->
  <!-- ========================================== -->
  <text x="95" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">System Partition</text>
  <text x="95" y="555" text-anchor="middle" font-size="11" fill="#7f8c8d">(The Actual OS)</text>

  <!-- Android -->
  <rect x="190" y="520" width="220" height="60" rx="6" fill="url(#androidGrad)" stroke="#229954" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="545" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Sony Android 14</text>
  <text x="300" y="565" text-anchor="middle" font-size="11" fill="#1e8449">(Stock System)</text>

  <!-- Lineage -->
  <rect x="430" y="520" width="220" height="60" rx="6" fill="url(#lineageGrad)" stroke="#b9770e" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="545" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d6608">LineageOS 22.2</text>
  <text x="540" y="565" text-anchor="middle" font-size="11" fill="#9a7d0a">(Android 15 / payload.bin)</text>

  <!-- Sailfish -->
  <rect x="670" y="520" width="260" height="60" rx="6" fill="url(#sailfishGrad)" stroke="#2471a3" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="545" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">Sailfish OS</text>
  <text x="800" y="565" text-anchor="middle" font-size="11" fill="#21618c">(sailfish.img001)</text>


  <!-- ========================================== -->
  <!-- VISUAL ARROWS / FLOW -->
  <!-- ========================================== -->
  
  <!-- Arrow 1 to 2 -->
  <path d="M 410 260 L 430 260" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 410 450 L 430 450" stroke="#e74c3c" stroke-width="3"/>
  <path d="M 410 550 L 430 550" stroke="#e74c3c" stroke-width="3"/>

  <!-- Arrow 2 to 3 -->
  <path d="M 650 450 L 670 450" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 650 360 L 670 360" stroke="#e74c3c" stroke-width="3"/>
  <path d="M 650 550 L 670 550" stroke="#e74c3c" stroke-width="3"/>

  <!-- ========================================== -->
  <!-- LEGEND / BOTTOM -->
  <!-- ========================================== -->
  <rect x="20" y="620" width="910" height="160" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  
  <text x="475" y="650" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Understanding the "Remaining" Pieces</text>

  <text x="40" y="680" font-size="14" fill="#2c3e50">• <tspan font-weight="bold" fill="#27ae60">Green boxes</tspan> remain untouched. These are the hardware drivers and firmware (Blobs).</text>
  <text x="40" y="705" font-size="14" fill="#2c3e50">• <tspan font-weight="bold" fill="#d4ac0d">Yellow boxes</tspan> are replaced during the LineageOS sideload (Recovery and System).</text>
  <text x="40" y="730" font-size="14" fill="#2c3e50">• <tspan font-weight="bold" fill="#2471a3">Blue boxes</tspan> are replaced when you flash Sailfish (Kernel, System, Boot).</text>
  <text x="40" y="755" font-size="14" fill="#e74c3c" font-weight="bold">⚠ Note: If the touchscreen fails on Lineage (Step 2), the underlying Sony drivers (Blobs) are often mismatched.</text>
  <text x="40" y="775" font-size="14" fill="#e74c3c" font-weight="bold">    Flashing Stock Android 14 first ensures the "Green boxes" are fresh before you flash Sailfish.</text>

</svg>